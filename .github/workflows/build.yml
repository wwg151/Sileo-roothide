name: Build Sileo (roothide and rootless)

on:
  push:
    branches: ["dev"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sileo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: iphoneos-arm64e
            bootstrap: roothide
          - arch: iphoneos-arm64
            bootstrap: rootless
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Test functional search
        shell: bash
        run: bash Scripts/test-functional-search.sh

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi
          dpkg-deb --version | head -1
          ldid 2>&1 | head -1 || true

      - name: Build ${{ matrix.arch }} (${{ matrix.bootstrap }})
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          make clean DEBUG=0 ALL_BOOTSTRAPS=1 SILEO_PLATFORM="$TARGET_ARCH"
          set +e
          make package DEBUG=0 ALL_BOOTSTRAPS=1 SILEO_PLATFORM="$TARGET_ARCH" V=1 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the compiler errors as annotations: the run page shows
            # those without signing in.
            grep -E ": error:" build.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi
          set -e
          mkdir -p out
          packages=(packages/*_"$TARGET_ARCH".deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          cp "${packages[0]}" out/

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -f build.log ]; then
            grep -E ": error:" build.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::--- tail of the log ---"
            tail -40 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "::error::no build.log was written"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.bootstrap }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          cd out
          arch=${{ matrix.arch }}
          deb="$(ls ./*_"$arch".deb)"
          test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
          echo "$deb: $(dpkg-deb -f "$deb" Package) $(dpkg-deb -f "$deb" Version) [$arch]"
          shasum -a 256 ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: sileo-${{ matrix.bootstrap }}
          path: |
            out/*.deb
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish deb to GitHub Releases
        if: matrix.bootstrap == 'roothide'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=roothide-dev
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Sileo (roothide) — dev builds" \
              --notes "Automatic iphoneos-arm64e builds of the dev branch." \
              --prerelease
          fi
          gh release upload "$tag" out/*.deb out/SHA256SUMS --clobber

  # Every dev build is pushed into the Pages repository's debs/ folder, where
  # the repository's own workflow indexes it. DEPLOY_PAT is the secret the
  # repository holds, with write access to that repository.
  deploy:
    name: Push deb packages to repo
    needs: build
    runs-on: ubuntu-latest
    steps:
        - name: Download roothide artifacts
          uses: actions/download-artifact@v4
          with:
            name: sileo-roothide
            path: debs/roothide

        - name: Download rootless artifacts
          uses: actions/download-artifact@v4
          with:
            name: sileo-rootless
            path: debs/rootless

        - name: Checkout repo
          uses: actions/checkout@v4
          with:
            repository: wwg151/repo
            token: ${{ secrets.DEPLOY_PAT }}
            path: website
            fetch-depth: 0

        - name: Copy deb
          shell: bash
          run: |
            set -euo pipefail
            mkdir -p website/debs
            cp debs/roothide/*.deb debs/rootless/*.deb website/debs/
            ls -la website/debs/ | grep -i sileo

        - name: Commit and push
          shell: bash
          run: |
            set -uo pipefail
            cd website
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # The repository ignores debs/ in .gitignore, but its index and Pages
            # are built from the folder in the working tree, so the file is added
            # by force.
            git add -A -f debs/
            if git diff --staged --quiet; then
              echo "No changes to deploy."
              exit 0
            fi
            git commit -m "chore: update Sileo debs (${{ github.sha }})"
            # The repository's own workflow pushes an index commit on every deb it
            # sees, so the branch has usually moved on by the time this runs: the
            # commit is put on top of the current main and the push retried.
            # A refusal is shown as an annotation, which needs no sign-in.
            for attempt in 1 2 3; do
              if git fetch origin main:refs/remotes/origin/main && git rebase origin/main; then
                if git push origin HEAD:main > /tmp/push.log 2>&1; then
                  cat /tmp/push.log
                  exit 0
                fi
                echo "::warning::push attempt ${attempt} was refused"
                cat /tmp/push.log
              else
                git rebase --abort || true
                echo "::warning::rebase attempt ${attempt} failed"
              fi
              sleep 5
            done
            if [ -f /tmp/push.log ]; then
              while IFS= read -r line; do
                echo "::error::$line"
              done < /tmp/push.log
            else
              echo "::error::the deb could not be pushed to the repository"
            fi
            exit 1

  # # Re-running this workflow publishes the same build again.
