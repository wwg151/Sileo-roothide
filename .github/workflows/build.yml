name: Build Sileo (roothide)

on:
  push:
    branches: ["dev"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sileo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build:
    name: Build iphoneos-arm64e
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi
          dpkg-deb --version | head -1
          ldid 2>&1 | head -1 || true

      - name: Build iphoneos-arm64e (roothide)
        shell: bash
        run: |
          set -euo pipefail
          make clean package DEBUG=0 ALL_BOOTSTRAPS=1 SILEO_PLATFORM=iphoneos-arm64e XCPRETTY="| grep -E 'error:|BUILD (FAILED|SUCCEEDED)' || true"
          mkdir -p out
          cp packages/*.deb out/

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          cd out
          arch=iphoneos-arm64e
          deb="$(ls ./*_"$arch".deb)"
          test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
          echo "$deb: $(dpkg-deb -f "$deb" Package) $(dpkg-deb -f "$deb" Version) [$arch]"
          shasum -a 256 ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: sileo-roothide
          path: |
            out/*.deb
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish deb to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=roothide-dev
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Sileo (roothide) — dev builds" \
              --notes "Automatic iphoneos-arm64e builds of the dev branch." \
              --prerelease
          fi
          gh release upload "$tag" out/*.deb out/SHA256SUMS --clobber

  deploy:
    name: Push deb packages to repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: sileo-roothide
          path: debs

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: wwg135/wwg135.github.io
          token: ${{ secrets.DEPLOY_PAT }}
          path: website

      - name: Copy deb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/debs
          cp debs/*.deb website/debs/
          ls -la website/debs/ | grep -i sileo

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A debs/
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "chore: update Sileo-roothide debs (${{ github.sha }})"
            git push
          fi
